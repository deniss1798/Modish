name: Credential guard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test credential guard
        run: python -m unittest discover -s backend/tests -p test_secret_scan.py -v
      - name: Scan repository credentials
        run: python scripts/scan_secrets.py
