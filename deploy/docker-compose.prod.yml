services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: modish
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: modish
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
