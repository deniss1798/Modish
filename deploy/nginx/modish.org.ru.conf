# Modish API — modish.org.ru (без http2: стабильнее на Android)
# /etc/nginx/sites-available/modish.org.ru
# sudo ln -sf /etc/nginx/sites-available/modish.org.ru /etc/nginx/sites-enabled/
# sudo certbot --nginx -d modish.org.ru

upstream modish_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name modish.org.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name modish.org.ru;

    ssl_certificate     /etc/letsencrypt/live/modish.org.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modish.org.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12M;
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://modish_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
